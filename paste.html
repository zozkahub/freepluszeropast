<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10131a">
<meta name="robots" content="noindex">
<title>نص مشترك | freepluszero</title>
<link rel="icon" type="image/jpeg" href="/assets/freepluszero.jpg">
<link rel="stylesheet" href="/style.css">
</head>
<body class="reader-page">
<header class="app-header reader-header">
<div class="header-content">
<a class="brand" href="/" aria-label="freepluszero - الصفحة الرئيسية"><img src="/assets/freepluszero.jpg" alt="freepluszero"><span>freepluszero</span></a>
<div class="header-actions">
<button id="langToggle" class="button secondary compact" type="button" aria-label="Switch language / تبديل اللغة">EN</button>
<a class="new-paste-link" href="/" data-i18n="newPaste">+ نص جديد</a>
</div>
</div>
</header>
<main class="reader-main">
<section class="reader-loading" id="loadingView"><span></span><p data-i18n="loading">جارٍ فتح النص...</p></section>
<section class="reader-card" id="pasteView" hidden>
<div class="reader-heading">
<div>
<p class="section-kicker">SHARED TEXT</p>
<h1 id="sharedTitle">نص بدون عنوان</h1>
</div>
<div class="reader-actions">
<button class="button secondary compact" id="downloadButton" type="button" data-i18n="downloadTxt">تنزيل TXT</button>
<button class="button primary compact" id="copyTextButton" type="button" data-i18n="copyText">نسخ النص</button>
</div>
</div>
<div class="reader-meta"><span id="sharedDate"></span><span id="sharedViews"></span><span id="sharedType"></span></div>
<article class="text-reader" id="sharedText"></article>
<div class="reader-bottom">
<span><span data-i18n="sharedVia">تمت المشاركة عبر</span> <b>freepluszero</b></span>
<div><a id="telegramShare" href="#" target="_blank" rel="noopener" data-i18n="telegram">تليجرام</a><a id="whatsappShare" href="#" target="_blank" rel="noopener" data-i18n="whatsapp">واتساب</a></div>
</div>
</section>
<section class="not-found" id="notFoundView" hidden>
<div class="not-found-mark">!</div>
<p class="section-kicker">404</p>
<h1 data-i18n="notFoundTitle">هذا النص غير متاح</h1>
<p data-i18n="notFoundBody">ربما انتهت مدة حفظه أو أن الرابط غير صحيح.</p>
<a class="button primary" href="/" data-i18n="createNew">إنشاء نص جديد</a>
</section>
</main>
<footer class="app-footer"><span>freepluszero</span><span>Shared text page</span></footer>
<div class="telegram-float" id="floatingTelegram">
<a href="https://t.me/gumball_Season8" target="_blank" rel="noopener" title="تليجرام freepluszero" data-i18n-attr="title:telegramTitle"><img src="/assets/telegram.png" alt="تليجرام"></a>
<button id="hideTelegram" type="button" aria-label="إخفاء زر تليجرام" data-i18n-attr="aria-label:hideTelegram">×</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/i18n.js"></script>
<script src="/paste.js"></script>
</body>
</html>
