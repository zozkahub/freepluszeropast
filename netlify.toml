[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/pastes"
  to = "/.netlify/functions/pastes"
  status = 200
  force = true

[[redirects]]
  from = "/api/pastes/*"
  to = "/.netlify/functions/pastes"
  status = 200
  force = true

[[redirects]]
  from = "/p/*"
  to = "/paste.html"
  status = 200
